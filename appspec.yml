version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/naver-main-web-server

permissions:
  - object: /
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    type:
      - file
      - directory

hooks:
  ApplicationStart:
    - location: scripts/start-server.sh
      timeout: 60
      runas: ubuntu