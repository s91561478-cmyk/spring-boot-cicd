name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub Repository의 코드 불러오기
        uses: actions/checkout@v7

      - name: JDK 17 버전 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: 테스트 및 빌드
        run: ./gradlew clean build

      - name: 빌드된 파일 이름 변경
        run: mv ./build/libs/*SNAPSHOT.jar ./spring-boot-cicd.jar

      - name: SCP로 EC2에 빌드된 파일 전송하기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: spring-boot-cicd.jar
          target: /home/ubuntu/naver-main-web-server/tobe

      - name: ssh로 EC2에 접속
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script_stop: true
          script: |
            rm -rf /home/ubuntu/naver-main-web-server/current
            mkdir /home/ubuntu/naver-main-web-server/current
            mv /home/ubuntu/naver-main-web-server/tobe/spring-boot-cicd.jar /home/ubuntu/naver-main-web-server/current/spring-boot-cicd.jar
            cd /home/ubuntu/naver-main-web-server/current
            sudo fuser -k -n tcp 8080 || true
            nohup java -jar spring-boot-cicd.jar > ./output.log 2>&1 &
            rm -rf /home/ubuntu/naver-main-web-server/tobe
            