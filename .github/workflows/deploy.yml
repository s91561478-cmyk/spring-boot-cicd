name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub Actions Runner에 GitHub 파일 불러오기
        uses: actions/checkout@v7

      - name: GitHub Actions에 JDK 17 버전 설치
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: gradle에 실행 권한 부여
        run: chmod +x gradlew

      - name: 애플리케이션 테스트 및 빌드
        run: ./gradlew clean build

      - name: 빌드된 파일의 이름 변경
        run: mv ./build/libs/*SNAPSHOT.jar ./spring-boot-cicd.jar

      - name: 빌드된 파일을 압축
        run: tar -czvf $GITHUB_SHA.tar.gz spring-boot-cicd.jar appspec.yml scripts

      - name: AWS 자격증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.IAM_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.IAM_SECRET_KEY }}

      - name: 압축한 파일을 S3에 업로드
        run: aws s3 cp --region ap-northeast-2 ./$GITHUB_SHA.tar.gz s3://naver-main-web-server/$GITHUB_SHA.tar.gz

      - name: CodeDeploy에게 애플리케이션 배포 요청
        run: |
          aws deploy create-deployment \
            --application-name spring-boot-cicd \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name dev \
            --s3-location bucket=naver-main-web-server,bundleType=tgz,key=$GITHUB_SHA.tar.gz